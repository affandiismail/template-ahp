<style>

}

<body>
<div class="wrap"><header id="head"><h1>Formulir survei prioritas</h1></header><main id="app"></main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// AHP + rank-scoring engine replicating the Excel template logic.
const ENGINE = (() => {
  const CONV = { "-9": 9, "-7": 7, "-5": 5, "-3": 3, "1": 1, "3": 1 / 3, "5": 1 / 5, "7": 1 / 7, "9": 1 / 9 };
  const RI = { 1: 0, 2: 0, 3: 0.58, 4: 0.9, 5: 1.12, 6: 1.24, 7: 1.32, 8: 1.41, 9: 1.45, 10: 1.49, 11: 1.51, 12: 1.48, 13: 1.56, 14: 1.57, 15: 1.59 };
  const TEMPLATE_WEIGHTS = [0.3718198280031762, 0.37848460783651705, 0.2496955641603066];

  const isBlank = v => v === null || v === undefined || v === "";
  const num = v => (isBlank(v) ? NaN : Number(v));
  function geomean(arr) {
    const xs = arr.filter(x => Number.isFinite(x));
    if (!xs.length) return NaN;
    if (xs.some(x => x <= 0)) return NaN;
    return Math.exp(xs.reduce((s, x) => s + Math.log(x), 0) / xs.length);
  }
  function pairs(n) { const p = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) p.push([i, j]); return p; }
  function convert(v) { if (isBlank(v)) return { blank: true }; const k = String(Number(v)); return k in CONV ? { val: CONV[k] } : { invalid: true }; }

  function ahpFromMatrix(A) {
    const n = A.length;
    const colsum = A[0].map((_, j) => A.reduce((s, r) => s + r[j], 0));
    const norm = A.map(r => r.map((x, j) => x / colsum[j]));
    const w = norm.map(r => r.reduce((s, x) => s + x, 0) / n);
    const lambda = colsum.reduce((s, c, j) => s + c * w[j], 0);
    const CI = n > 1 ? (lambda - n) / (n - 1) : 0;
    const ri = RI[n] ?? 1.59;
    const CR = ri > 0 ? CI / ri : 0;
    // exact principal eigenvector by power iteration (reference only)
    let v = Array(n).fill(1 / n);
    for (let it = 0; it < 500; it++) {
      const nv = A.map(r => r.reduce((s, x, j) => s + x * v[j], 0));
      const s = nv.reduce((a, b) => a + b, 0);
      v = nv.map(x => x / s);
    }
    const Av = A.map(r => r.reduce((s, x, j) => s + x * v[j], 0));
    const lambdaExact = Av.reduce((s, x, i) => s + x / v[i], 0) / n;
    return { A, colsum, norm, w, lambda, CI, RI: ri, CR, wExact: v, lambdaExact };
  }

  function criteria(state) {
    const n = state.criteria.length, P = pairs(n);
    const issues = [];
    const conv = state.pairwise.map((row, r) => P.map((_, k) => { const c = convert(row[k]); if (c.invalid) issues.push({ r, k, v: row[k] }); return c; }));
    const agg = P.map((_, k) => geomean(conv.map(row => row[k].val)));
    const A = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 1 : NaN)));
    P.forEach(([i, j], k) => { A[i][j] = agg[k]; A[j][i] = 1 / agg[k]; });
    const ok = A.every(r => r.every(Number.isFinite));
    const res = ok ? ahpFromMatrix(A) : null;
    const perResp = conv.map(row => {
      if (row.every(c => c.blank)) return null;
      if (row.some(c => !Number.isFinite(c.val))) return { incomplete: true };
      const M = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 1 : 0)));
      P.forEach(([i, j], k) => { M[i][j] = row[k].val; M[j][i] = 1 / row[k].val; });
      const r = ahpFromMatrix(M); return { CR: r.CR, w: r.w };
    });
    const nResp = conv.filter(row => row.some(c => Number.isFinite(c.val))).length;
    return { pairs: P, agg, res, issues, perResp, nResp, conv };
  }

  function excelRank(vals) { return vals.map(v => (Number.isFinite(v) ? 1 + vals.filter(x => Number.isFinite(x) && x > v).length : NaN)); }

  function quadrant(x, y, mx, my) {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return "";
    if (x > mx && y > my) return "K1";
    if (x > mx && y < my) return "K2";
    if (x < mx && y > my) return "K3";
    return "K4";
  }
  const mean = a => { const f = a.filter(Number.isFinite); return f.length ? f.reduce((s, x) => s + x, 0) / f.length : NaN; };

  function group(g, weights, opts) {
    const N = g.items.length, C = weights.length;
    const issues = [];
    const scan = (mat, label) => mat.forEach((row, i) => row.forEach((v, j) => {
      if (isBlank(v)) return; const x = Number(v);
      if (!Number.isFinite(x) || x < 1 || x > N || !Number.isInteger(x)) issues.push(`${label}: ${g.items[i] ? "baris " + (i + 1) : ""}, responden ${j + 1} berisi "${v}" (harus bilangan bulat 1 sampai ${N})`);
    }));
    g.ranks.forEach((m, c) => scan(m, `Kriteria ${c + 1}`));
    scan(g.funding, "Pendanaan");
    const gm = g.ranks.map(m => m.map(row => geomean(row.map(num))));
    const norm = gm.map(col => col.map(G => (N > 1 ? ((N - G) / (N - 1)) * 100 : NaN)));
    const score = norm.map((col, c) => col.map(s => s * weights[c]));
    const lastExcluded = opts.excludeLastInTotal && C > 1;
    const total = g.items.map((_, i) => score.reduce((s, col, c) => s + (lastExcluded && c === C - 1 ? 0 : col[i]), 0));
    const rankC = score.map(excelRank);
    const rankT = excelRank(total);
    const fgm = g.funding.map(row => geomean(row.map(num)));
    const fund = fgm.map(G => (N > 1 ? ((N - G) / (N - 1)) * 100 : NaN));
    const fMean = mean(fund);
    const qC = norm.map(col => { const mx = mean(col); return { mx, q: col.map((x, i) => quadrant(x, fund[i], mx, fMean)) }; });
    const tMean = mean(total);
    const qT = total.map((x, i) => quadrant(x, fund[i], tMean, fMean));
    const priority = g.items.map((_, i) => qC.every(q => q.q[i] === "K1" || q.q[i] === "K2"));
    const needsFinancing = fund.map(f => Number.isFinite(f) && f < 50);
    // duplicate-rank warnings per respondent
    const ties = [];
    g.ranks.forEach((m, c) => { const R = m[0] ? m[0].length : 0; for (let j = 0; j < R; j++) { const col = m.map(r => r[j]).filter(v => !isBlank(v)); if (col.length && new Set(col.map(String)).size < col.length) ties.push({ c, j }); } });
    return { N, gm, norm, score, total, rankC, rankT, fgm, fund, fMean, qC, tMean, qT, priority, needsFinancing, issues, ties, lastExcluded };
  }

  function run(state) {
    const crit = criteria(state);
    const replica = state.mode === "replica";
    let weights;
    if (replica && state.criteria.length === 3) weights = TEMPLATE_WEIGHTS.slice();
    else weights = crit.res ? crit.res.w.slice() : state.criteria.map(() => NaN);
    const groups = state.groups.map((g, gi) => group(g, weights, { excludeLastInTotal: replica && gi === 1 }));
    return { crit, weights, groups, replica };
  }
  return { run, pairs, convert, geomean, RI, TEMPLATE_WEIGHTS, CONV };
})();


const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = (x, d = 2) => (Number.isFinite(x) ? x.toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–");
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2800); }
function b64enc(obj) { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function b64dec(s) { s = s.trim().replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
const STORE = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const SCALE_WORD = { 1: "sama penting dengan", 3: "sedikit lebih penting daripada", 5: "lebih penting daripada", 7: "sangat lebih penting daripada", 9: "mutlak lebih penting daripada" };
// coded value convention (same as the Excel template): negative = first criterion more important
function describePair(a, b, v) {
  if (v === undefined || v === null || v === "") return "";
  const x = Number(v); if (x === 1) return `${a} ${SCALE_WORD[1]} ${b}`;
  return x < 0 ? `${a} ${SCALE_WORD[-x]} ${b}` : `${b} ${SCALE_WORD[x]} ${a}`;
}
// AHP for a single respondent's coded pairwise answers
function respondentAHP(n, coded) {
  const P = ENGINE.pairs(n);
  const A = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 1 : NaN)));
  for (let k = 0; k < P.length; k++) {
    const c = ENGINE.convert(coded[k]); if (!Number.isFinite(c.val)) return null;
    const [i, j] = P[k]; A[i][j] = c.val; A[j][i] = 1 / c.val;
  }
  const colsum = A[0].map((_, j) => A.reduce((s, r) => s + r[j], 0));
  const w = A.map(r => r.reduce((s, x, j) => s + x / colsum[j], 0) / n);
  const lambda = colsum.reduce((s, c, j) => s + c * w[j], 0);
  const CI = n > 1 ? (lambda - n) / (n - 1) : 0, RI = ENGINE.RI[n] ?? 1.59, CR = RI > 0 ? CI / RI : 0;
  // pair whose judgement departs most from the weights implied by the other answers
  let worst = -1, dev = 0;
  P.forEach(([i, j], k) => { const d = Math.abs(Math.log(A[i][j] * w[j] / w[i])); if (d > dev) { dev = d; worst = k; } });
  return { A, w, CR, lambda, worst };
}
function quadScatter(pts, mx, my, xLab) {
  const W = 420, H = 340, L = 44, Rr = 12, T = 12, B = 40, pw = W - L - Rr, ph = H - T - B;
  const X = v => L + (Math.max(0, Math.min(100, v)) / 100) * pw, Y = v => T + ph - (Math.max(0, Math.min(100, v)) / 100) * ph;
  const xm = X(mx), ym = Y(my);
  let s = `<svg class="sc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagram kuadran ${esc(xLab)} terhadap pendanaan">`;
  const shade = (x, y, w, h, k) => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" fill="var(--${k})" opacity=".08"/>`;
  if (Number.isFinite(xm) && Number.isFinite(ym)) {
    s += shade(xm, T, L + pw - xm, ym - T, "k1") + shade(xm, ym, L + pw - xm, T + ph - ym, "k2") + shade(L, T, xm - L, ym - T, "k3") + shade(L, ym, xm - L, T + ph - ym, "k4");
    s += `<text x="${L + pw - 4}" y="${T + 13}" text-anchor="end" style="fill:var(--k1);font-weight:600">K1</text><text x="${L + pw - 4}" y="${T + ph - 6}" text-anchor="end" style="fill:var(--k2);font-weight:600">K2</text><text x="${L + 4}" y="${T + 13}" style="fill:var(--k3);font-weight:600">K3</text><text x="${L + 4}" y="${T + ph - 6}" style="fill:var(--k4);font-weight:600">K4</text>`;
  }
  for (let v = 0; v <= 100; v += 25) s += `<text x="${X(v)}" y="${T + ph + 15}" text-anchor="middle">${v}</text><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  s += `<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="none" stroke="var(--line)"/>`;
  if (Number.isFinite(xm)) s += `<line x1="${xm}" x2="${xm}" y1="${T}" y2="${T + ph}" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
  if (Number.isFinite(ym)) s += `<line x1="${L}" x2="${L + pw}" y1="${ym}" y2="${ym}" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
  s += `<text x="${L + pw / 2}" y="${H - 6}" text-anchor="middle">${esc(xLab)}</text><text transform="translate(12 ${T + ph / 2}) rotate(-90)" text-anchor="middle">Skor pendanaan</text>`;
  pts.filter(p => Number.isFinite(p.x) && Number.isFinite(p.y)).forEach(p => {
    s += `<g class="pt"><title>${esc(p.code + " " + p.name)}: ${fmt(p.x, 1)}, ${fmt(p.y, 1)} (${p.q})</title><circle cx="${X(p.x)}" cy="${Y(p.y)}" r="10" fill="var(--${(p.q || "K4").toLowerCase()})" stroke="var(--surface)" stroke-width="1.5"/><text x="${X(p.x)}" y="${Y(p.y) + 3.3}" text-anchor="middle">${esc(p.code)}</text></g>`;
  });
  return s + `</svg>`;
}

let cfg = null, api = null, ans = null, steps = [], si = 0, KEY = "", token = "", me = null, prevResp = null;

function shuffle(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

}

/* ---- session start ---- */
function fromPrevious(p) {
  const order = rk => rk.map((r, i) => [r, i]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const P = ENGINE.pairs(cfg.criteria.length), pw = {}; P.forEach((_, k) => (pw[k] = p.pairwise[k]));
  const seen = {}; cfg.groups.forEach((_, g) => { cfg.criteria.forEach((_, c) => (seen[`r${g}-${c}`] = true)); seen[`f${g}`] = true; });
  return { pw, order: cfg.groups.map((_, g) => cfg.criteria.map((_, c) => order(p.ranks[g][c]))), fund: cfg.groups.map((g, gi) => (p.funding ? order(p.funding[gi]) : shuffle(g.items.length))), seen, consentAt: p.consentAt, submitted: true, mode: "sent", last: p };
}
function start(config, profile, previous) {
  me = profile;
  if (!config) return fail("Survei ini belum dibuka oleh penyelenggara. Silakan hubungi penyelenggara survei.");
  if (config.closed) return fail("Survei ini sudah ditutup. Terima kasih atas perhatian Anda.");
  cfg = config;
  if (!cfg.criteria || cfg.criteria.length < 2) return fail("Konfigurasi survei tidak valid. Hubungi penyelenggara survei.");
  document.title = cfg.title || document.title;
  KEY = `ahp-form-${cfg.id}-${cfg.version}-${me.username}`;
  ans = STORE.get(KEY);
  const valid = ans && ans.order && ans.order.length === cfg.groups.length;
  if (!valid) {
    try { ans = previous && previous.version === cfg.version ? fromPrevious(previous) : null; } catch (e) { ans = null; }
    if (!ans) ans = { pw: {}, order: cfg.groups.map(g => cfg.criteria.map(() => shuffle(g.items.length))), fund: cfg.groups.map(g => shuffle(g.items.length)), seen: {}, submitted: false };
  }
  steps = ["consent", "intro", "pw", "check"];
  cfg.groups.forEach((g, gi) => cfg.criteria.forEach((_, c) => steps.push(`rank:${gi}:${c}`)));
  if (fundOn()) cfg.groups.forEach((_, gi) => steps.push(`fund:${gi}`));
  steps.push("review", "done");
  si = ans.submitted ? steps.length - 1 : Math.min(ans.step || 0, steps.length - 2);
  if (!ans.consentAt) si = 0;
  persist(); render();
}
function persist() { ans.step = si; STORE.set(KEY, ans); }
function go(d) { si = Math.max(0, Math.min(steps.length - 1, si + d)); persist(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function progress() {
  const total = steps.length - 1, pct = Math.round((Math.min(si, total) / total) * 100);
  return `<div class="prog" aria-label="Kemajuan ${pct}%"><i style="width:${pct}%"></i></div><div class="progtxt">Langkah ${Math.min(si + 1, total)} dari ${total}</div>`;
}
function nav(nextLabel = "Lanjut", nextOk = true, hint = "") {
  return `<div class="navbar">${si > 0 ? `<button class="btn" id="back">Kembali</button>` : "<span></span>"}<span class="hint">${esc(hint)}</span><button class="btn primary" id="next" ${nextOk ? "" : "disabled"}>${esc(nextLabel)}</button></div>`;
}
function bindNav(onNext) {
  const b = $("#back"); if (b) b.addEventListener("click", () => go(-1));
  const n = $("#next"); if (n) n.addEventListener("click", () => (onNext ? onNext() : go(1)));
}

function render() {
  const s = steps[si];
  $("#head").innerHTML = `<div class="who"><span>Masuk sebagai <b>${esc(me.name || me.username)}</b></span><button class="btn small ghost" id="out">Keluar</button></div><h1>${esc(cfg.title || "Survei prioritas")}</h1>` + (s !== "done" ? progress() : "");
  $("#out").addEventListener("click", () => { if (ans.submitted || confirm("Keluar sekarang? Jawaban yang sudah diisi tetap tersimpan di perangkat ini.")) logout(); });

  if (s === "pw") return rPw();
  if (s === "check") return rCheck();
  if (s.startsWith("rank:")) { const [, g, c] = s.split(":").map(Number); return rRank(g, c); }
  if (s.startsWith("fund:")) return rFund(+s.split(":")[1]);

function richText(t) {

    if (list) { h += "</ul>"; list = false; }
    if (!x) return;
    const next = (lines[i + 1] || "").trim();
    if (x.length <= 50 && !/[.:;,]$/.test(x) && /^[-•]\s+/.test(next)) h += `<h3>${esc(x)}</h3>`;

const SCALE = [-9, -7, -5, -3, 1, 3, 5, 7, 9];

function myAHP() { const P = ENGINE.pairs(cfg.criteria.length); return respondentAHP(cfg.criteria.length, P.map((_, k) => ans.pw[k])); }

/* ---- ranking ---- */
function rankList(order, items, id) {

}

  const draw = (focusPos, dir) => {
    $("#app").innerHTML = `<div class="card"><div class="ctx">${esc(G.name)}: pendanaan</div><h2>Urutkan menurut kemampuan pendanaan daerah</h2>
    <p class="sub">${esc(cfg.funding.question || "Posisi 1 adalah usulan yang paling mampu dibiayai oleh daerah sendiri tanpa pembiayaan eksternal.")} Urutan awal diacak.</p>
    ${rankList(ans.fund[g], G.items, "list")}</div>` + nav("Urutan ini sudah sesuai");
    bindRank(ans.fund[g], draw);
    if (focusPos !== undefined) { const el = document.querySelectorAll("#list li")[focusPos]; if (el) { el.classList.add("moved"); const btn = el.querySelector(`[data-mv="${focusPos}:${dir || -1}"]`); if (btn && !btn.disabled) btn.focus(); else el.querySelector("select").focus(); } }
    bindNav(() => { ans.seen[key] = true; go(1); });
  };
  draw();
}

/* ---- review + submit ---- */
function buildResponse() {
  const P = ENGINE.pairs(cfg.criteria.length), r = myAHP();
  const toRanks = order => { const rk = Array(order.length); order.forEach((it, pos) => (rk[it] = pos + 1)); return rk; };
  return {
    surveyId: cfg.id, version: cfg.version, uid: "u:" + me.username, username: me.username,
    respondent: { name: me.name, org: me.org, role: me.role }, consentAt: ans.consentAt,
    pairwise: P.map((_, k) => ans.pw[k]), cr: r ? r.CR : null,
    ranks: cfg.groups.map((_, g) => cfg.criteria.map((_, c) => toRanks(ans.order[g][c]))),
    funding: fundOn() ? cfg.groups.map((_, g) => toRanks(ans.fund[g])) : null,
    submittedAt: new Date().toISOString(), client: "formulir-ahp-2"
  };
}
function rReview() {
  const r = myAHP(), C = cfg.criteria, P = ENGINE.pairs(C.length);
  const missing = steps.filter(s => (s.startsWith("rank:") || s.startsWith("fund:")) && !ans.seen[s.startsWith("rank:") ? "r" + s.slice(5).replace(":", "-") : "f" + s.slice(5)]);
  let h = `<div class="card"><h2>Periksa sebelum mengirim</h2><p class="sub">${esc(me.name)}${me.org ? ", " + esc(me.org) : ""}${me.role ? ", " + esc(me.role) : ""}</p>
  <h3>Perbandingan kriteria</h3><ul class="plain">${P.map(([i, j], k) => `<li>${esc(describePair(C[i].name, C[j].name, ans.pw[k]))}</li>`).join("")}</ul>
  ${r && C.length >= 3 ? `<p class="note">Rasio konsistensi: ${fmt(r.CR, 2)} ${r.CR <= 0.1 ? `<span class="badge ok">konsisten</span>` : `<span class="badge no">belum konsisten</span>`}</p>` : ""}
  <h3>Tiga teratas pada setiap urutan</h3>`;
  cfg.groups.forEach((G, g) => {
    cfg.criteria.forEach((Cc, c) => { h += `<p class="top3"><b>${esc(G.name)}, ${esc(Cc.name)}:</b> ${ans.order[g][c].slice(0, 3).map((it, p) => `${p + 1}. ${esc(G.items[it])}`).join("; ")}</p>`; });
    if (fundOn()) h += `<p class="top3"><b>${esc(G.name)}, pendanaan:</b> ${ans.fund[g].slice(0, 3).map((it, p) => `${p + 1}. ${esc(G.items[it])}`).join("; ")}</p>`;
  });
  h += `</div>`;
  if (missing.length) h += `<div class="alert warn">Ada ${missing.length} urutan yang belum Anda konfirmasi. Gunakan tombol Kembali untuk memeriksanya.</div>`;
  $("#app").innerHTML = h + `<div id="sendmsg"></div>` + nav("Kirim jawaban", !missing.length);
  bindNav(submit);
}
async function submit() {
  const resp = buildResponse(); ans.last = resp; persist();
  const btn = $("#next"); btn.disabled = true; btn.textContent = "Mengirim…";
  let err = "network";
  try {
    const j = await call({ action: "submit", token, response: resp });
    if (j.ok) { ans.submitted = true; ans.mode = "sent"; go(1); return; }
    err = j.error || "gagal";
  } catch (e) { err = "network"; }
  btn.disabled = false; btn.textContent = "Coba kirim lagi";
  if (err === "session_expired") {
    $("#sendmsg").innerHTML = `<div class="alert warn">Sesi Anda sudah berakhir. Masuk kembali untuk mengirim; jawaban Anda tetap tersimpan di perangkat ini.</div><div class="row" style="margin-bottom:14px"><button class="btn primary" id="relog">Masuk kembali</button></div>`;
    $("#relog").addEventListener("click", logout); return;
  }
  if (err === "survey_closed") { $("#sendmsg").innerHTML = `<div class="alert warn">Survei ini sudah ditutup atau diperbarui oleh penyelenggara, sehingga jawaban tidak dapat diterima. Silakan hubungi penyelenggara survei.</div>`; return; }
  $("#sendmsg").innerHTML = `<div class="alert warn">Jawaban belum terkirim karena koneksi bermasalah. Coba lagi, atau kirim kode jawaban kepada penyelenggara.</div><div class="row" style="margin-bottom:14px"><button class="btn" id="asCode">Tampilkan kode jawaban</button></div>`;
  $("#asCode").addEventListener("click", () => { ans.submitted = true; ans.mode = "code"; go(1); });
}
function rDone() {
  const resp = ans.last || buildResponse();
  let h;
  if (ans.mode === "sent") h = `<div class="card done"><h2>Terima kasih, jawaban Anda sudah terkirim.</h2><p class="sub">Anda boleh menutup halaman ini atau menekan Keluar. Bila ingin mengubah jawaban, gunakan tombol di bawah lalu kirim ulang; jawaban terbaru yang akan dipakai. Bila perangkat ini dipakai responden lain, tekan Keluar agar mereka dapat masuk dengan akunnya sendiri.</p></div>`;
  else {
    const code = "AHP1." + b64enc(resp);
    const wa = "https://wa.me/?text=" + encodeURIComponent(`Kode jawaban survei ${cfg.title || "AHP"} dari ${resp.respondent.name}:\n${code}`);
    h = `<div class="card done"><h2>Kirimkan kode jawaban ini kepada penyelenggara</h2>
    <p class="sub">${cfg.contact ? `Kirim ke: <b>${esc(cfg.contact)}</b>. ` : ""}Salin seluruh kode di bawah, lalu kirim lewat WhatsApp atau email. Kode memuat semua jawaban Anda.</p>
    <textarea class="t code" id="code" readonly>${esc(code)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="copy">Salin kode</button><a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">Kirim lewat WhatsApp</a></div></div>`;
  }
  $("#app").innerHTML = h + `<div class="row"><button class="btn" id="edit">Ubah jawaban</button><button class="btn" id="out3">Keluar</button></div>`;
  $("#out3").addEventListener("click", logout);
  const cp = $("#copy"); if (cp) cp.addEventListener("click", async () => {
    const ta = $("#code"); try { await navigator.clipboard.writeText(ta.value); toast("Kode disalin"); } catch (e) { ta.select(); try { document.execCommand("copy"); toast("Kode disalin"); } catch (_) { toast("Pilih teks kode lalu salin secara manual"); } }
  });
  $("#edit").addEventListener("click", () => { ans.submitted = false; si = steps.indexOf("review"); persist(); render(); });
}
init();

</script>
</body>
</html>
